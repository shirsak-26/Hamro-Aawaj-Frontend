<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <title>Admin Login | Hamro Aawaj</title>
  </head>
  <body>
    <main class="form-page">
      <div class="form-card">
        <div class="brand"><span class="brand-mark">🤟</span>Hamro Aawaj</div>
        <p style="color: var(--muted)">Administrator Panel</p>
        <h1>Admin Login</h1>
        <p class="sub">Frontend preview of the administrator sign-in page.</p>
        <form id="adminLoginForm">
          <div class="field">
            <label>Email</label>
            <input
              id="adminEmail"
              type="email"
              required
              placeholder="admin@example.com"
            />
          </div>
          <div class="field">
            <label>Password</label
            ><input
              id="adminPassword"
              type="password"
              required
              placeholder="••••••••"
            />
          </div>
          <button class="btn btn-primary" style="width: 100%">Sign in</button>
          <div
            class="form-message notice hidden"
            style="margin-top: 15px"
          ></div>
        </form>
        <p class="auth-link"><a href="../index.html">← Back to website</a></p>
      </div>
    </main>
    <script src="../assets/js/script.js"></script>
    <script src="../assets/js/admin.js"></script>
  </body>
</html>
