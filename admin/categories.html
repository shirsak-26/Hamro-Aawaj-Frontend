<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <title>Manage Categories | Admin</title>
  </head>
  <body class="admin-shell">
    <div class="admin-layout">
      <aside class="sidebar">
        <a class="admin-brand" href="dashboard.html"
          ><span class="brand-mark">🤟</span>Hamro Aawaj</a
        >
        <nav class="admin-nav">
          <a class="active" href="dashboard.html">📊 Dashboard</a
          ><a href="users.html">👥 Manage Users</a
          ><a href="categories.html">📂 Categories</a
          ><a href="lessons.html">📚 Lessons</a
          ><a href="images.html">🖼️ Images</a><a href="videos.html">🎥 Videos</a
          ><a href="quizzes.html">📝 Quizzes</a
          ><a href="feedback.html">💬 Feedback</a
          ><a href="messages.html">✉️ Contact Messages</a
          ><a href="profile.html">👤 Admin Profile</a
          ><a href="login.html">🚪 Logout</a>
        </nav>
      </aside>
      <main class="admin-main">
        <div id="categoryFormCard" class="admin-card" style="display: none">
          <h2 id="categoryFormTitle">Add Category</h2>

          <form id="categoryForm">
            <div class="field">
              <label for="categoryName">Category Name</label>
              <input
                id="categoryName"
                type="text"
                required
                placeholder="e.g. Greetings"
              />
            </div>

            <div class="field">
              <label for="categoryDescription">Description</label>
              <input
                id="categoryDescription"
                type="text"
                required
                placeholder="e.g. Basic expressions"
              />
            </div>

            <button type="submit" class="btn btn-primary">Save Category</button>

            <button type="button" id="cancelCategoryBtn" class="btn btn-light">
              Cancel
            </button>

            <div
              id="categoryMessage"
              class="form-message notice hidden"
              style="margin-top: 15px"
            ></div>
          </form>
        </div>
        <div class="admin-top">
          <div>
            <h1>Manage Categories</h1>
            <p style="color: var(--muted)">
              Create and organize NSL learning topics.
            </p>
          </div>
          <button id="addCategoryBtn" class="btn btn-primary">
            + Add Category
          </button>
        </div>
        <div class="admin-card">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Category</th>
                  <th>Description</th>
                  <th>Lessons</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="categoryTableBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <script src="../assets/js/adminCategories.js"></script>
  </body>
</html>
