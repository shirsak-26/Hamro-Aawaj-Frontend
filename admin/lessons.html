      <main class="admin-main">
        <div class="admin-top">
          <div>
            <h1>Manage Lessons</h1>
            <p style="color: var(--muted)">Add, edit and organize lessons.</p>
          </div>
          <button id="addLessonBtn" class="btn-primary" type="button">
    + Add Lesson
</button>
        </div>
        
<div id="lessonForm" class="admin-card hidden">

    <h2 id="lessonFormTitle">Add Lesson</h2>

    <form id="lessonFormElement">

        <div class="admin-form-grid">

            <div class="field">
                <label for="lessonTitle">Lesson title</label>

                <input
                    id="lessonTitle"
                    type="text"
                    required
                    placeholder="Basic Greetings"
                />
            </div>

            <div class="field">
                <label for="lessonCategory">Category</label>

                <select id="lessonCategory" required>
                    <option value="">Select category</option>
                </select>
            </div>

        </div>

        <div class="field">

            <label for="lessonDescription">
                Description
            </label>

            <textarea
                id="lessonDescription"
                rows="4"
                required
                placeholder="Learn common greetings and polite expressions."
            ></textarea>

        </div>

        <div class="admin-form-grid">

            <div class="field">
    <label>Photos</label>

    <div id="photoInputs">
        <div class="photo-input-row">
            <input
                type="url"
                class="lessonPhoto"
                placeholder="https://example.com/photo.jpg"
            />

            <button
                type="button"
                class="btn btn-light add-photo-btn"
            >
                + Add Photo
            </button>
        </div>
    </div>
</div>

   <div class="field">
    <label>Videos</label>

    <div id="videoInputs">
        <div class="video-input-row">
            <input
                type="url"
                class="lessonVideo"
                placeholder="https://youtube.com/watch?v=..."
            />

            <button
                type="button"
                class="btn btn-light add-video-btn"
            >
                + Add Video
            </button>
        </div>
    </div>
</div>

        </div>

        <button
            type="submit"
            class="btn btn-primary"
        >
            Save Lesson
        </button>

        <button
            type="button"
            id="cancelLessonBtn"
            class="btn btn-light"
        >
            Cancel
        </button>

        <div
            id="lessonMessage"
            class="form-message notice hidden"
            style="margin-top: 15px;"
        ></div>

    </form>

</div>

          </div>

        <div class="admin-card">

    <div class="table-wrap">

        <table class="table">

            <thead>
                <tr>
                    <th>Lesson</th>
                    <th>Category</th>
                    <th>Level</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="lessonTableBody">
                <!-- Lessons loaded from backend -->
            </tbody>

        </table>

    </div>
          
      </main>
    </div>
